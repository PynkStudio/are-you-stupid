name: are_you_stupid
description: "ARE YOU STUPID? — a one-handed, offline hyper-casual game about failing at simple instructions."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  app_tracking_transparency: ^2.0.7
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  mobile_scanner: ^7.4.0
  nsd: ^5.0.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
