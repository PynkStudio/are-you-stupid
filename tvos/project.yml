name: AYSHost
options:
  deploymentTarget:
    tvOS: "16.0"

packages:
  AYSProtocol:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    INFOPLIST_FILE: App/Info.plist
    # One App Store product page for iPhone + Apple TV + Mac (universal
    # purchase): every platform ships under the phone app's bundle id. See
    # docs/Meta/Decision Log.md.
    PRODUCT_BUNDLE_IDENTIFIER: com.ays.areYouStupid
    PRODUCT_NAME: "Are You Stupid"
    DEVELOPMENT_TEAM: G48384PHQK
    CODE_SIGN_STYLE: Automatic

targets:
  AYSHost-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - TVResources
    dependencies:
      - package: AYSProtocol
        product: AYSHostUI
      - package: AYSProtocol
        product: AYSHostCore
      - package: AYSProtocol
        product: AYSProtocol
    configFiles:
      Debug: Config/Presenter.xcconfig
      Release: Config/Presenter.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  # macOS has no separate host target any more: the Flutter app in macos/
  # embeds the AYSHostUI package and opens the board from MULTIPLAYER →
  # HOST ON THIS MAC. See docs/Meta/Decision Log.md.

schemes:
  AYSHost-tvOS:
    build:
      targets:
        AYSHost-tvOS: all
    run:
      config: Debug
